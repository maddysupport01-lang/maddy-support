    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Libre Baskerville",Georgia,serif;color:var(--text);background:linear-gradient(165deg,#07111e 0%,#050d18 50%,#030810 100%);min-height:100vh;line-height:1.75}

    footer{padding:40px 0 50px;border-top:1px solid var(--line)}.footer-stack{text-align:center;color:var(--muted);line-height:1.75}
    .footer-brand{font-family:"Bodoni Moda",Georgia,serif;color:var(--cream);font-size:1.85rem;font-weight:600}.footer-stack a{color:var(--cream)}
